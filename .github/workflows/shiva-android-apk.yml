
name: Build SHIVA AI Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP if present
        shell: bash
        run: |
          if [ -f "SHIVA_AI_Android.zip" ]; then
            sudo apt-get update
            sudo apt-get install -y unzip
            mkdir -p extracted
            unzip -oq SHIVA_AI_Android.zip -d extracted
          fi

      - name: Find Android project and build APK
        shell: bash
        run: |
          PROJECT_DIR="$(find . -type f -name settings.gradle \
            -not -path './.git/*' \
            -not -path './*/.gradle/*' \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle nahi mili."
            echo "Repository mein Android project files upload karo."
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Project found: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

          APK="$(find app/build/outputs/apk/debug \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK nahi bani."
            exit 1
          fi

          echo "APK_PATH=$PWD/$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHIVA-AI-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

