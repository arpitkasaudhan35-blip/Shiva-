
name: Build Shiva AI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SHIVA_AI_Android.zip'
      - '.github/workflows/shiva-android-apk.yml'

permissions:
  contents: read

jobs:
  build:
      - name: Find Android project and build APK
        shell: bash
        run: |
          echo "Searching for Android project..."
          find . -type f -name settings.gradle -print
          find . -type f -name build.gradle -print

          PROJECT_DIR="$(find . -type f -name settings.gradle -not -path './.git/*' -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle nahi mili. Project files upload check karo."
            exit 1
          fi

          cd "$PROJECT_DIR"
          gradle assembleDebug

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -q SHIVA_AI_Android.zip -d extracted

      - name: Find Android project and build APK
        run: |
          GRADLEW="$(find "$GITHUB_WORKSPACE/extracted" -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: ZIP mein gradlew file nahi mili."
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "ERROR: APK file nahi mili."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/Shiva-AI-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shiva-AI-debug-APK
          path: Shiva-AI-debug.apk
