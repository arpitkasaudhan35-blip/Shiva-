
name: Build Shiva AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SHIVA_AI_Android.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -q SHIVA_AI_Android.zip -d extracted
          find extracted -type f -name gradlew -print

      - name: Build debug APK
        run: |
          GRADLEW="$(find "$GITHUB_WORKSPACE/extracted" -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: ZIP mein gradlew file nahi mili."
            echo "ZIP ke andar complete Android Gradle project hona chahiye."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$GRADLEW")"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          APK="$(find . -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "ERROR: APK file nahi bani."
            exit 1
          fi
          cp "$APK" "$GITHUB_WORKSPACE/Shiva-AI-debug.apk"

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Shiva-AI-debug-APK
          path: Shiva-AI-debug.apk
