name: Build SHIVA AI APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Files & Auto-Fix Manifest
        run: |
          # 1. Check if files are inside subfolder SHIVA_AI_Android
          if [ -d "SHIVA_AI_Android" ] && [ -f "SHIVA_AI_Android/build.gradle" ]; then
            PROJ_DIR="SHIVA_AI_Android"
          else
            PROJ_DIR="."
          fi

          echo "Target project directory: $PROJ_DIR"

          # 2. Check if AndroidManifest.xml exists, if missing, create it automatically
          MANIFEST_DIR="$PROJ_DIR/app/src/main"
          MANIFEST_FILE="$MANIFEST_DIR/AndroidManifest.xml"

          if [ ! -f "$MANIFEST_FILE" ]; then
            echo "AndroidManifest.xml missing! Auto-generating..."
            mkdir -p "$MANIFEST_DIR"
            cat << 'EOF' > "$MANIFEST_FILE"
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="SHIVA AI"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          fi

          # 3. Build APK with Gradle
          cd "$PROJ_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SHIVA-AI-debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          
